version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: comedy_gigs_app_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: 
      context: .
      target: base
    command: bundle exec rails server -b 0.0.0.0
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/comedy_gigs_app_development
      - REDIS_URL=redis://redis:6379/0
      - RAILS_ENV=development
      - RAILS_MAX_THREADS=5
    stdin_open: true
    tty: true

  sidekiq:
    build: 
      context: .
      target: base
    command: bundle exec sidekiq
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/comedy_gigs_app_development
      - REDIS_URL=redis://redis:6379/0
      - RAILS_ENV=development
    restart: unless-stopped

  # Optional: for running tests in isolation
  test:
    build: 
      context: .
      target: base
    command: bundle exec rspec
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/comedy_gigs_app_test
      - REDIS_URL=redis://redis:6379/1
      - RAILS_ENV=test
    profiles:
      - test

volumes:
  postgres_data:
  redis_data:
  bundle_cache:
  node_modules:
